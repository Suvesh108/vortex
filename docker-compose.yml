version: '3.8'

services:
  vortexdownloader:
    build:
      context: .
      dockerfile: Dockerfile
    image: vortexdownloader:latest
    container_name: vortexdownloader
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
    restart: unless-stopped
    volumes:
      # Optional: mount a local directory to retrieve downloaded files directly or persist cache
      - ./backend/temp_downloads:/app/backend/temp_downloads
